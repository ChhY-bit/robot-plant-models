# 阿克曼转向结构机器人默认参数
# 约定：
#   - 结构为前轮转向、后轮驱动。
#   - 4 个车轮的有效滚动半径、宽度及物理转速上限相同。
#   - 前后轮距相同。
#   - 车体尺寸的排列顺序为 [长度, 宽度, 高度]。
#   - 长度、时间、角度和角速度的单位分别为 m、s、rad 和 rad/s。
#   - 轮速均指车轮侧转速，而非减速器前的电机轴转速。

# 4 个车轮共用的有效滚动半径 [m]。
wheelRadius: 0.1

# 前后轮轴间距离，即轴距 [m]。
wheelBase: 0.60

# 左右车轮中心线之间的横向距离，即前后轴共用的轮距 [m]。
trackWidth: 0.45

# 车轮虚拟转速一阶响应的时间常数 [s]。
# 若设为 0.0，构造机器人对象时会给出警告，并将其替换为
# 1e-3 s，以近似无惯性的理想执行器。
wheelTimeConstant: 0.2

# 转向虚拟角度一阶响应的时间常数 [s]。
# 若设为 0.0，构造机器人对象时会给出警告，并将其替换为
# 1e-3 s，以近似无惯性的理想执行器。
steeringTimeConstant: 0.1

# 任一物理车轮转速绝对值的最大限制 [rad/s]。
# 不分别限幅各轮转速，而是据此计算虚拟轮速的可行范围。
maxPhysicalWheelSpeed: 20.0

# 任一物理前轮转角绝对值的最大限制 [rad]。
# 不分别限幅左右前轮，而是据此计算虚拟转角上限。
# 当前取 35 deg。
maxPhysicalSteeringAngle: 0.61086524

# 不包含车轮的车体主体包围盒尺寸 [长度, 宽度, 高度]，单位为 m。
bodySize: [0.70, 0.40, 0.20]

# 4 个车轮共用的沿车轴方向宽度 [m]。
wheelWidth: 0.05

# 后轮轴中点相对车体几何中心沿车体前向轴的偏移量 [m]。
# 正值表示后轮轴位于车体几何中心前方。
rearAxleOffset: -0.30
