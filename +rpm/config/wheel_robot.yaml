# 差速轮式机器人默认参数
# 约定：
#   - 双元素车轮参数的排列顺序为 [左轮, 右轮]。
#   - 车体尺寸的排列顺序为 [长度, 宽度, 高度]。
#   - 长度、时间和角速度的单位分别为 m、s 和 rad/s。
#   - 轮速均指车轮侧转速，而非减速器前的电机轴转速。

# 左右车轮的有效滚动半径 [m]。
wheelRadius: [0.10, 0.10]

# 左右车轮中心线之间的横向距离，即轮距 [m]。
trackWidth: 0.45

# 左右车轮转速一阶响应的时间常数 [s]。
# 若某个元素设为 0.0，构造机器人对象时会给出警告，并将其替换为
# 1e-3 s，以近似无惯性的理想执行器。
motorTimeConstant: [0.15, 0.15]

# 左右车轮角速度绝对值的最大限制 [rad/s]。
maxWheelSpeed: [20.0, 20.0]

# 不包含车轮的车体主体包围盒尺寸 [长度, 宽度, 高度]，单位为 m。
bodySize: [0.60, 0.40, 0.20]

# 左右车轮沿车轴方向的宽度 [m]。
wheelWidth: [0.05, 0.05]

# 驱动轴中点相对车体几何中心沿车体前向轴的偏移量 [m]。
# 正值表示驱动轴位于车体几何中心前方。
axleOffset: 0.0
